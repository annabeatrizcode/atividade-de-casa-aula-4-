<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho - Pizza House</title>
</head>

<body>

    <header>

        <h1>🍕 Pizza House</h1>

        <nav>
            <a href="index.html">Início</a>
            <a href="cardapio.html">Cardápio</a>
            <a href="carrinho.html">Carrinho</a>
        </nav>

    </header>

    <main>

        <h2>🛒 Seu Carrinho</h2>

        <div id="pedido">

            <h3 id="sabor"></h3>

            <p>
                <strong>Tamanho:</strong>
                <span id="tamanho"></span>
            </p>

            <p>
                <strong>Quantidade:</strong>
                <span id="quantidade"></span>
            </p>

            <br>

            <a href="cardapio.html">
                ← Continuar comprando
            </a>

            <br><br>

            <a href="pagamento.html" id="finalizar">
                Finalizar pedido →
            </a>

        </div>

    </main>

    <script>

        // Pega os dados enviados pelo pedido.html
        const url = new URLSearchParams(window.location.search);

        const sabor = url.get("sabor");
        const tamanho = url.get("tamanho");
        const quantidade = url.get("quantidade");

        // Se existe um pedido
        if (sabor && tamanho && quantidade) {

            document.getElementById("sabor").textContent =
                "🍕 " + sabor;

            document.getElementById("tamanho").textContent =
                tamanho;

            document.getElementById("quantidade").textContent =
                quantidade;

            // Envia os mesmos dados para o pagamento
            document.getElementById("finalizar").href =
                "pagamento.html?sabor=" +
                encodeURIComponent(sabor) +
                "&tamanho=" +
                encodeURIComponent(tamanho) +
                "&quantidade=" +
                encodeURIComponent(quantidade);

        } else {

            // Se não escolheu nada
            document.getElementById("pedido").innerHTML =
                "<p>🛒 Seu carrinho está vazio.</p>" +
                "<br>" +
                "<a href='cardapio.html'>Escolher uma pizza 🍕</a>";

        }

    </script>

</body>

</html>
