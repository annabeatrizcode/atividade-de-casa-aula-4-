<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seu Pedido - Pizza House</title>
</head>

<body>

    <header>
        <h1>🍕 Pizza House</h1>
    </header>

    <main>

        <h2>Monte seu pedido</h2>

        <form action="pagamento.html" method="GET">

            <h3>Pizza escolhida</h3>

            <label for="sabor">Sabor:</label>

            <select id="sabor" name="sabor">

                <option value="Calabresa">Calabresa</option>

                <option value="Frango com Catupiry">
                    Frango com Catupiry
                </option>

                <option value="Quatro Queijos">
                    Quatro Queijos
                </option>

                <option value="Marguerita">
                    Marguerita
                </option>

                <option value="Portuguesa">
                    Portuguesa
                </option>
                <option value="Promoção 1 "></option>

                <option value="Promoção 2"></option>

                <option value="promoção 3"></option>

                <option value="promoção 4"></option>
                

            </select>

            <br><br>

            <label for="tamanho">Tamanho:</label>

            <select id="tamanho" name="tamanho">

                <option value="Pequeno">
                    Pequeno
                </option>

                <option value="Médio" selected>
                    Médio
                </option>

                <option value="Grande">
                    Grande
                </option>

            </select>

            <br><br>

            <label for="quantidade">
                Quantidade:
            </label>

            <input
                type="number"
                id="quantidade"
                name="quantidade"
                value="1"
                min="1"
            >

            <br><br>

            <a href="cardapio.html">
                ← Voltar ao cardápio
            </a>

            <br><br>

            <button type="submit">
                Ir para o pagamento →
            </button>

        </form>

    </main>

    <script>

        // Pega o sabor escolhido no cardápio
        const url = new URLSearchParams(window.location.search);

        const saborEscolhido = url.get("sabor");

        // Se veio um sabor do cardápio,
        // seleciona ele automaticamente
        if (saborEscolhido) {
            document.getElementById("sabor").value = saborEscolhido;
        }

    </script>

</body>

</html>
