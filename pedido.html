<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seu Pedido - Pizza House</title>
</head>

<body>

    <header>
        <h1>🍕 Pizza House</h1>
    </header>

    <main>

        <h2>Monte seu pedido</h2>

        <!-- O formulário envia o usuário direto para a pagamento.html -->
        <form action="pagamento.html" method="GET" class="formulario">

            <h3>Pizza escolhida</h3>

            <!-- Campo simples para escolher o sabor -->
            <label for="sabor">Sabor:</label>
            <select id="sabor" name="sabor">
                <option value="Calabresa">Calabresa</option>
                <option value="Mussarela">Mussarela</option>
                <option value="Frango com Catupiry">Frango com Catupiry</option>
                <option value="quatro queijos">quatro queijos</option>
                <option value="Portuguesa">Portuguesa</option>
            </select>

            <br><br>

            <label for="tamanho">Tamanho:</label>
            <select id="tamanho" name="tamanho">
                <option value="Pequeno">Pequeno</option>
                <option value="Médio" selected>Médio</option>
                <option value="Grande">Grande</option>
            </select>

            <br><br>

            <label for="quantidade">Quantidade:</label>
            <input type="number" id="quantidade" name="quantidade" value="1" min="1">

            <br><br>

            <a href="cardapio.html">
                ← Voltar ao cardápio
            </a>

            <br><br>

            <!-- O botão type="submit" envia o formulário e abre a pagamento.html -->
            <button type="submit">
                Ir para o Pagamento →
            </button>

        </form>

    </main>

</body>

</html>
